services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: otb
      POSTGRES_USER: otb
      POSTGRES_PASSWORD: ${DB_PASSWORD:-otb-dev}
    ports:
      - '5432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./postgres/init.sql:/docker-entrypoint-initdb.d/init.sql

  server:
    build:
      context: ..
      dockerfile: apps/server/Dockerfile
    environment:
      NODE_ENV: production
      DB_URL: postgres://otb:${DB_PASSWORD:-otb-dev}@postgres:5432/otb
      JWT_SECRET: ${JWT_SECRET}
      LOG_LEVEL: info
    ports:
      - '3000:3000'
    depends_on:
      - postgres

  web:
    build:
      context: ..
      dockerfile: apps/web/Dockerfile
    ports:
      - '80:80'
    depends_on:
      - server

volumes:
  postgres_data:
